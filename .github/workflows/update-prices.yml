name: Update prices

# Twice-weekly price refresh (Tue 20:00 / Fri 07:00 ART) + manual dispatch.
#
# How it works:
#   1. Check out this repo (the source of truth for `manual-prices.json`,
#      `materials.json`, `categories.json`, and the published outputs).
#   2. Check out `kapta-desktop-app` into ./app — that repo owns the scraper
#      code (`src/pricing/`). We don't duplicate it here.
#   3. Copy our input files into the app's `data/` so the scraper sees them.
#   4. Run `npm run update-prices` inside the app. It writes:
#        app/data/prices/latest.json
#        app/data/prices/latest.csv
#        app/data/prices/history/prices-YYYY-MM-DD.{json,csv}
#   5. Copy the outputs back into this repo.
#   6. Rebuild `history/index.json` — the desktop app can't list a directory
#      over raw.githubusercontent.com, so this is how it discovers which
#      snapshots to mirror. See `mirrorHistory` in the app's
#      `src/pricing/remoteSource.ts`.
#   7. Commit and push.
#
# Failure modes:
#   - All scraper sources can fail individually (the script tolerates this).
#     The output `latest.json` will still be written, with whatever it found.
#   - If the script itself crashes, no commit happens — the previous snapshot
#     stays as the latest, which is the desired behavior.
#   - If `npm run update-prices` produces no diff (rare), the commit step
#     no-ops (`git commit ... || echo "no changes"`).

on:
  schedule:
    # Tuesdays 23:00 UTC (= 20:00 ART) and Fridays 10:00 UTC (= 07:00 ART).
    - cron: '0 23 * * 2'
    - cron: '0 10 * * 5'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you running this manually?'
        required: false
        default: 'manual refresh'
      runner:
        description: 'Runner label. Leave as ubuntu-latest; `kapta` is the self-hosted AR box, currently offline.'
        required: false
        default: 'ubuntu-latest'

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    # GitHub-hosted. This job used to default to a self-hosted `kapta` runner
    # on a residential AR IP, on the theory that the Cloudflare-fronted
    # suppliers block GitHub's Azure ranges. That does not reproduce: a
    # 2026-07-28 dispatch on ubuntu-latest returned 150 prices across all four
    # scraped suppliers with zero failures (run 30372787964). Meanwhile the
    # self-hosted box went offline in May and every scheduled run since queued
    # for 24h and was auto-cancelled — ~10 weeks with no price refresh.
    #
    # `workflow_dispatch` can still override the label if a supplier ever does
    # start blocking, but `kapta` needs bringing back online first.
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Check out kapta-prices
        uses: actions/checkout@v4
        with:
          path: prices

      - name: Check out kapta-desktop-app
        uses: actions/checkout@v4
        with:
          repository: faculoyarte/kapta-desktop-app
          path: app
          ref: main
          token: ${{ secrets.KAPTA_APP_READ_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install app dependencies
        working-directory: app
        # No-lockfile install is fine; the app pins few versions (`latest`).
        # If a lockfile lands later, switch to `npm ci`.
        run: npm install --no-audit --no-fund

      - name: Sync inputs into app
        run: |
          mkdir -p app/data/prices app/data/catalog
          cp prices/manual-prices.json app/data/prices/manual-prices.json
          cp prices/materials.json     app/data/catalog/materials.json
          cp prices/categories.json    app/data/catalog/categories.json

      - name: Run update-prices
        working-directory: app
        env:
          MELI_REFRESH_TOKEN: ${{ secrets.MELI_REFRESH_TOKEN }}
          MELI_CLIENT_ID:     ${{ secrets.MELI_CLIENT_ID }}
          MELI_CLIENT_SECRET: ${{ secrets.MELI_CLIENT_SECRET }}
          # Fall back to a static access token if no refresh credentials.
          MELI_ACCESS_TOKEN:  ${{ secrets.MELI_ACCESS_TOKEN }}
        run: npm run update-prices

      - name: Copy outputs back
        run: |
          mkdir -p prices/history
          cp app/data/prices/latest.json prices/latest.json
          cp app/data/prices/latest.csv  prices/latest.csv
          # History files are dated; copy whatever today produced.
          if compgen -G "app/data/prices/history/prices-*.json" > /dev/null; then
            cp app/data/prices/history/prices-*.json prices/history/
            cp app/data/prices/history/prices-*.csv  prices/history/
          fi

      - name: Rebuild history index
        working-directory: prices
        # raw.githubusercontent.com serves blobs, not directory listings, so
        # the desktop app has no way to discover which snapshots exist. This
        # index is that listing. Rebuilt from scratch each run so removals
        # propagate too.
        #
        # Deliberately no timestamp field: a value that changes every run would
        # dirty the tree on days with no price change and defeat the no-op
        # commit guard below. Only the `.json` snapshots are listed — the CSV
        # siblings are for humans, and the app's analytics never reads them.
        run: |
          node -e '
            const fs = require("fs");
            const re = /^prices-\d{4}-\d{2}-\d{2}\.json$/;
            const snapshots = fs.readdirSync("history").filter((f) => re.test(f)).sort();
            fs.writeFileSync("history/index.json", JSON.stringify({ snapshots }, null, 2) + "\n");
            console.log("indexed " + snapshots.length + " snapshots");
          '

      - name: Commit and push
        working-directory: prices
        run: |
          git config user.name  "kapta-prices-bot"
          git config user.email "kapta-prices-bot@users.noreply.github.com"
          git add latest.json latest.csv history/
          if git diff --cached --quiet; then
            echo "no price changes today"
          else
            git commit -m "prices: daily update $(date -u +%Y-%m-%d)"
            git push
          fi
